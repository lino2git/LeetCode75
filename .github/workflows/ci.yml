name: LeetCode 1768 CI Pipeline

on:
  push:
    branches: [ "main", "MergeStringsAlternately_1768" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 檢查出專案程式碼 (Checkout code)
      uses: actions/checkout@v4

    - name: 設定 Python 環境 ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 安裝測試依賴套件 (Install dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: 程式碼語法檢查 (Lint with flake8)
      run: |
        # 檢查是否有 Python 語法錯誤或未定義變數
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 執行單元測試 (Run Pytest)
      run: |
        pytest -v